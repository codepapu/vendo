spring:
  application:
    name: nexus-marketplace-service
  
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
  
  datasource:
    url: jdbc:postgresql://localhost:5432/nexus_db
    username: ${DB_USERNAME:nexus_user}
    password: ${DB_PASSWORD:nexus_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080}

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.nexus.marketplace: DEBUG
    org.springframework.web: INFO
