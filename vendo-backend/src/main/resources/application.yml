spring:
  application:
    name: vendo
  
  datasource:
    url: jdbc:postgresql://localhost:5432/vendo_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m,expireAfterAccess=5m
    cache-names: users,products,orders,categories
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@vendo.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080}
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:}
            client-secret: ${FACEBOOK_CLIENT_SECRET:}
            scope: email,public_profile
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: read:user,user:email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          facebook:
            authorization-uri: https://www.facebook.com/v12.0/dialog/oauth
            token-uri: https://graph.facebook.com/v12.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/v12.0/me?fields=id,name,email
            user-name-attribute: id
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: vendo-app
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      enable-idempotence: true

server:
  port: 8080

logging:
  level:
    com.vendo: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-must-be-at-least-32-characters-long-for-production}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

# Application Configuration
app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  storage:
    type: ${STORAGE_TYPE:s3} # s3 or minio
    s3:
      bucket: ${S3_BUCKET:vendo-uploads}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      endpoint: ${S3_ENDPOINT:} # For MinIO: http://localhost:9000
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: ${SMS_PROVIDER:twilio} # twilio or aws-sns
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
    aws-sns:
      region: ${AWS_SNS_REGION:us-east-1}
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
  notification:
    email:
      enabled: true
    sms:
      enabled: ${SMS_ENABLED:false}
    push:
      enabled: ${PUSH_ENABLED:false}

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Payment Gateway Configuration
payment:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    mode: ${PAYPAL_MODE:sandbox} # sandbox or live
    webhook-secret: ${PAYPAL_WEBHOOK_SECRET:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
    public-key: ${PAYSTACK_PUBLIC_KEY:}
    webhook-secret: ${PAYSTACK_WEBHOOK_SECRET:}
  mollie:
    api-key: ${MOLLIE_API_KEY:}
    webhook-secret: ${MOLLIE_WEBHOOK_SECRET:}
  sslcommerz:
    store-id: ${SSLCOMMERZ_STORE_ID:}
    store-password: ${SSLCOMMERZ_STORE_PASSWORD:}
    webhook-secret: ${SSLCOMMERZ_WEBHOOK_SECRET:}
  googlepay:
    merchant-id: ${GOOGLE_PAY_MERCHANT_ID:}
    api-key: ${GOOGLE_PAY_API_KEY:}
    webhook-secret: ${GOOGLE_PAY_WEBHOOK_SECRET:}
  phonepe:
    merchant-id: ${PHONEPE_MERCHANT_ID:}
    salt-key: ${PHONEPE_SALT_KEY:}
    salt-index: ${PHONEPE_SALT_INDEX:1}
    api-key: ${PHONEPE_API_KEY:}
    webhook-secret: ${PHONEPE_WEBHOOK_SECRET:}
    mode: ${PHONEPE_MODE:sandbox} # sandbox or production
  upi:
    merchant-id: ${UPI_MERCHANT_ID:}
    api-key: ${UPI_API_KEY:}
    webhook-secret: ${UPI_WEBHOOK_SECRET:}
    provider: ${UPI_PROVIDER:razorpay} # razorpay, paytm, etc.
