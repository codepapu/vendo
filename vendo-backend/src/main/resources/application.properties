# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=vendo-app
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.enable-idempotence=true

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.com.vendo=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Actuator/Management Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.enabled=true
management.health.enabled=true
management.health.redis.enabled=false
management.health.db.enabled=true
management.health.diskspace.enabled=false
management.health.defaults.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.circuitbreakers.enabled=false
management.health.kafka.enabled=false
management.health.mail.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-must-be-at-least-32-characters-long-for-production}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Application Configuration
app.name=${APP_NAME:Vendo}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.storage.type=${STORAGE_TYPE:local}
app.storage.s3.bucket=${S3_BUCKET:vendo-uploads}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.storage.s3.endpoint=${S3_ENDPOINT:}

# SMS Configuration
app.sms.enabled=${SMS_ENABLED:false}
app.sms.provider=${SMS_PROVIDER:twilio}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
app.sms.aws-sns.region=${AWS_SNS_REGION:us-east-1}
app.sms.aws-sns.access-key=${AWS_ACCESS_KEY:}
app.sms.aws-sns.secret-key=${AWS_SECRET_KEY:}

# Notification Configuration
app.notification.email.enabled=true
app.notification.sms.enabled=${SMS_ENABLED:false}
app.notification.push.enabled=${PUSH_ENABLED:false}

# CDN Configuration
app.cdn.enabled=${CDN_ENABLED:false}
app.cdn.base-url=${CDN_BASE_URL:}
app.cdn.provider=${CDN_PROVIDER:cloudflare}
app.cdn.api-key=${CDN_API_KEY:}
app.cdn.api-secret=${CDN_API_SECRET:}
app.cdn.zone-id=${CDN_ZONE_ID:}
app.cdn.cache-ttl=${CDN_CACHE_TTL:86400}

# Image Optimization Configuration
app.image.optimization.enabled=${IMAGE_OPTIMIZATION_ENABLED:true}
app.image.optimization.thumbnail.width=${IMAGE_THUMBNAIL_WIDTH:300}
app.image.optimization.thumbnail.height=${IMAGE_THUMBNAIL_HEIGHT:300}
app.image.optimization.medium.width=${IMAGE_MEDIUM_WIDTH:800}
app.image.optimization.medium.height=${IMAGE_MEDIUM_HEIGHT:800}
app.image.optimization.large.width=${IMAGE_LARGE_WIDTH:1920}
app.image.optimization.large.height=${IMAGE_LARGE_HEIGHT:1920}
app.image.optimization.webp.enabled=${IMAGE_WEBP_ENABLED:true}
app.image.optimization.quality=${IMAGE_QUALITY:0.85}

# Two-Factor Authentication Configuration
app.2fa.issuer=${2FA_ISSUER:Vendo}

# Rate Limiting Configuration
app.rate-limit.authenticated.limit=${RATE_LIMIT_AUTHENTICATED:1000}
app.rate-limit.authenticated.window-seconds=${RATE_LIMIT_AUTHENTICATED_WINDOW:3600}
app.rate-limit.unauthenticated.limit=${RATE_LIMIT_UNAUTHENTICATED:100}
app.rate-limit.unauthenticated.window-seconds=${RATE_LIMIT_UNAUTHENTICATED_WINDOW:3600}

# Tax API Configuration
tax.api.enabled=${TAX_API_ENABLED:false}
tax.api.provider=${TAX_API_PROVIDER:}
tax.api.base-url=${TAX_API_BASE_URL:}
tax.api.api-key=${TAX_API_KEY:}
tax.api.api-secret=${TAX_API_SECRET:}
tax.api.company-id=${TAX_API_COMPANY_ID:}
tax.api.timeout=${TAX_API_TIMEOUT:5000}
tax.api.cache-enabled=${TAX_API_CACHE_ENABLED:true}
tax.api.cache-ttl=${TAX_API_CACHE_TTL:3600}

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Payment Gateway Configuration - Stripe
payment.stripe.secret-key=${STRIPE_SECRET_KEY:}
payment.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Payment Gateway Configuration - PayPal
payment.paypal.client-id=${PAYPAL_CLIENT_ID:}
payment.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
payment.paypal.mode=${PAYPAL_MODE:sandbox}
payment.paypal.webhook-secret=${PAYPAL_WEBHOOK_SECRET:}

# Payment Gateway Configuration - Razorpay
payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Payment Gateway Configuration - Paystack
payment.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
payment.paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
payment.paystack.webhook-secret=${PAYSTACK_WEBHOOK_SECRET:}

# Payment Gateway Configuration - Mollie
payment.mollie.api-key=${MOLLIE_API_KEY:}
payment.mollie.webhook-secret=${MOLLIE_WEBHOOK_SECRET:}

# Payment Gateway Configuration - SSLCommerz
payment.sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:}
payment.sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:}
payment.sslcommerz.webhook-secret=${SSLCOMMERZ_WEBHOOK_SECRET:}

# Payment Gateway Configuration - Google Pay
payment.googlepay.merchant-id=${GOOGLE_PAY_MERCHANT_ID:}
payment.googlepay.api-key=${GOOGLE_PAY_API_KEY:}
payment.googlepay.webhook-secret=${GOOGLE_PAY_WEBHOOK_SECRET:}

# Payment Gateway Configuration - PhonePe
payment.phonepe.merchant-id=${PHONEPE_MERCHANT_ID:}
payment.phonepe.salt-key=${PHONEPE_SALT_KEY:}
payment.phonepe.salt-index=${PHONEPE_SALT_INDEX:1}
payment.phonepe.api-key=${PHONEPE_API_KEY:}
payment.phonepe.webhook-secret=${PHONEPE_WEBHOOK_SECRET:}
payment.phonepe.mode=${PHONEPE_MODE:sandbox}

# Payment Gateway Configuration - UPI
payment.upi.merchant-id=${UPI_MERCHANT_ID:}
payment.upi.api-key=${UPI_API_KEY:}
payment.upi.webhook-secret=${UPI_WEBHOOK_SECRET:}
payment.upi.provider=${UPI_PROVIDER:razorpay}

# Elasticsearch Configuration
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.username=${ELASTICSEARCH_USERNAME:}
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=60s
spring.data.elasticsearch.repositories.enabled=true
spring.data.elasticsearch.client.reactive.endpoints=${ELASTICSEARCH_ENDPOINTS:localhost:9200}


