# UPS Configuration
shipping.ups.enabled=false
shipping.ups.api-key=
shipping.ups.client-id=
shipping.ups.client-secret=
shipping.ups.account-number=
shipping.ups.sandbox=true
# FedEx Configuration
shipping.fedex.enabled=false
shipping.fedex.api-key=
shipping.fedex.client-id=
shipping.fedex.client-secret=
shipping.fedex.account-number=
shipping.fedex.sandbox=true
# DHL Configuration
shipping.dhl.enabled=false
shipping.dhl.api-key=
shipping.dhl.site-id=
shipping.dhl.password=
shipping.dhl.account-number=
shipping.dhl.sandbox=true

# Push Notification Configuration
app.push.enabled=${PUSH_ENABLED:false}
app.push.provider=${PUSH_PROVIDER:fcm}
# FCM Configuration
app.push.fcm.service-account-path=${FCM_SERVICE_ACCOUNT_PATH:}
app.push.fcm.project-id=${FCM_PROJECT_ID:}
# APNS Configuration
app.push.apns.bundle-id=${APNS_BUNDLE_ID:}
app.push.apns.key-id=${APNS_KEY_ID:}
app.push.apns.team-id=${APNS_TEAM_ID:}
app.push.apns.certificate-path=${APNS_CERTIFICATE_PATH:}
app.push.apns.key-path=${APNS_KEY_PATH:}
app.push.apns.sandbox=${APNS_SANDBOX:true}

# Email Marketing Configuration
marketing.enabled=${MARKETING_ENABLED:false}
marketing.provider=${MARKETING_PROVIDER:mailchimp}
# Mailchimp Configuration
marketing.mailchimp.api-key=${MAILCHIMP_API_KEY:}
marketing.mailchimp.list-id=${MAILCHIMP_LIST_ID:}
marketing.mailchimp.server-prefix=${MAILCHIMP_SERVER_PREFIX:}
# SendGrid Configuration
marketing.sendgrid.api-key=${SENDGRID_API_KEY:}
marketing.sendgrid.list-id=${SENDGRID_LIST_ID:}
