spring:
  application:
    name: nexus-content-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/nexus_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  
  config:
    import: optional:configserver:http://localhost:8888
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:9000}

server:
  port: 8085

# Service Discovery
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.nexus: DEBUG
    org.springframework.web: INFO

# Media Service Configuration
file:
  upload:
    dir: ${FILE_UPLOAD_DIR:./uploads}

# CDN Configuration
app:
  cdn:
    enabled: ${CDN_ENABLED:false}
    base-url: ${CDN_BASE_URL:}

# File Storage Configuration
file:
  upload:
    dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size: 52428800 # 50MB
