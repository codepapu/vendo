spring:
  application:
    name: nexus-config-service
  
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_REPO_URI:file://${user.home}/nexus-config-repo}
          default-label: main
          clone-on-start: true
          force-pull: true
        native:
          search-locations: classpath:/config
      server:
        accept-empty: false

server:
  port: 8888

# Service Discovery
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,refresh
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.springframework.cloud.config: DEBUG
